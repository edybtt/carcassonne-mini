<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carcassonne Mini</title>
  <meta name="description" content="A simple 2D Carcassonne game that runs right in your browser – play against the computer or with friends online.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏰</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <main id="boardWrap">
      <canvas id="board" aria-label="Game board"></canvas>
      <div id="toast" role="status"></div>
      <div class="board-tools">
        <button id="btnZoomIn" title="Zoom in (+)">+</button>
        <button id="btnZoomOut" title="Zoom out (−)">−</button>
        <button id="btnCenter" title="Center the board (C)">⌖</button>
      </div>
      <div id="actionBar" class="action-bar" hidden>
        <div id="timer" class="timer" hidden title="Time left this turn"><span id="timerNum">30</span></div>
        <div id="barText" class="bar-text"></div>
        <button class="btn" id="btnUndo" title="Take the tile back (Esc)" aria-label="Undo">↶<span class="lbl"> Undo</span></button>
        <button class="btn" id="btnRotate" title="Rotate (R / right click)" aria-label="Rotate">⟳<span class="lbl"> Rotate</span></button>
        <button class="btn primary" id="btnSkip" title="No meeple (Enter / Space)">No meeple</button>
      </div>
    </main>

    <aside id="panel">
      <header class="panel-head">
        <h1>Carcassonne <span>Mini</span></h1>
        <div class="head-btns">
          <button class="btn small" id="btnRules">Rules</button>
          <button class="btn small" id="btnNew">New game</button>
        </div>
      </header>

      <div id="netInfo" hidden></div>
      <section id="players"></section>

      <section class="turn">
        <div id="status"></div>
        <div class="tile-row">
          <div class="preview-wrap">
            <canvas id="preview" title="Click to rotate it"></canvas>
          </div>
          <div class="tile-info">
            <b>Current tile</b>
            <div id="deckCount"></div>
            <small>Click it to rotate it.</small>
          </div>
        </div>
      </section>

      <section class="log-wrap">
        <h3>Log</h3>
        <ul id="log"></ul>
      </section>
    </aside>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <!-- PeerJS: direct browser-to-browser connections for the online lobby -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
  <script src="game.js" defer></script>
</body>
</html>
