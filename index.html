<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carcassonne Mini</title>
  <meta name="description" content="Un joc Carcassonne 2D, simplu, direct în browser.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏰</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <main id="boardWrap">
      <canvas id="board" aria-label="Tabla de joc"></canvas>
      <div id="toast" role="status"></div>
      <div class="board-tools">
        <button id="btnZoomIn" title="Mărește (+)">+</button>
        <button id="btnZoomOut" title="Micșorează (−)">−</button>
        <button id="btnCenter" title="Centrează tabla (C)">⌖</button>
      </div>
      <div id="actionBar" class="action-bar" hidden>
        <div id="timer" class="timer" hidden title="Timp rămas din tură"><span id="timerNum">30</span></div>
        <div id="barText" class="bar-text"></div>
        <button class="btn" id="btnUndo" title="Ia piesa înapoi (Esc)" aria-label="Anulează">↶<span class="lbl"> Anulează</span></button>
        <button class="btn" id="btnRotate" title="Rotește (R / click dreapta)" aria-label="Rotește">⟳<span class="lbl"> Rotește</span></button>
        <button class="btn primary" id="btnSkip" title="Fără meeple (Enter / Space)">Fără meeple</button>
      </div>
    </main>

    <aside id="panel">
      <header class="panel-head">
        <h1>Carcassonne <span>Mini</span></h1>
        <div class="head-btns">
          <button class="btn small" id="btnRules">Reguli</button>
          <button class="btn small" id="btnNew">Joc nou</button>
        </div>
      </header>

      <div id="netInfo" hidden></div>
      <section id="players"></section>

      <section class="turn">
        <div id="status"></div>
        <div class="tile-row">
          <div class="preview-wrap">
            <canvas id="preview" title="Click ca s-o rotești"></canvas>
          </div>
          <div class="tile-info">
            <b>Piesa curentă</b>
            <div id="deckCount"></div>
            <small>Click pe ea ca s-o rotești.</small>
          </div>
        </div>
      </section>

      <section class="log-wrap">
        <h3>Jurnal</h3>
        <ul id="log"></ul>
      </section>
    </aside>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <!-- PeerJS: conexiuni directe între browsere pentru lobby-ul online -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
  <script src="game.js" defer></script>
</body>
</html>
